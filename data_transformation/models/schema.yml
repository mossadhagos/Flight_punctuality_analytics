version: 2
models:
- name: src_airports
  description: Standardized reference data for the ten monitored Swedish airports.
  columns:
  - name: iata_code
    description: Three-letter airport code.
    data_tests:
    - unique
    - not_null
  - name: airport_name
    description: Airport name from Wikipedia.
    data_tests:
    - not_null
- name: src_airlines
  description: 'Standardized Wikipedia airline reference records. Includes historical
    operators and reused airline codes. Missing reference attributes remain null.

    '
  columns:
  - name: reference_id
    description: Identifier generated from the original reference row.
    data_tests:
    - unique
    - not_null
  - name: iata_code
    description: Airline IATA code; may be missing or reused.
  - name: icao_code
    description: Airline ICAO code; may be missing or reused.
  - name: airline_name
    description: Airline name; missing values remain null.
- name: src_arrivals
  description: 'Standardized Swedavia arrival records. Deleted records are retained
    and flagged. Multiple source records can describe the same flight leg.

    '
  columns:
  - name: flight_id
    data_tests:
    - not_null
  - name: airport_iata
    description: Monitored Swedish airport.
    data_tests:
    - not_null
  - name: scheduled_date
    description: Service date requested from the API.
    data_tests:
    - not_null
  - name: scheduled_at_utc
    description: Scheduled arrival timestamp in UTC.
    data_tests:
    - not_null
  - name: actual_at_utc
    description: Actual arrival timestamp in UTC, when available.
  - name: is_deleted
    description: True when the source flight status is DEL.
- name: src_departures
  description: 'Standardized Swedavia departure records. Deleted records are retained
    and flagged. Multiple source records can describe the same flight leg.

    '
  columns:
  - name: flight_id
    data_tests:
    - not_null
  - name: airport_iata
    description: Monitored Swedish airport.
    data_tests:
    - not_null
  - name: scheduled_date
    description: Service date requested from the API.
    data_tests:
    - not_null
  - name: scheduled_at_utc
    description: Scheduled departure timestamp in UTC.
    data_tests:
    - not_null
  - name: actual_at_utc
    description: Actual departure timestamp in UTC, when available.
  - name: is_deleted
    description: True when the source flight status is DEL.
- name: dim_airport
  description: One row per monitored Swedish airport.
  columns:
  - name: airport_key
    description: Surrogate key generated from the airport IATA code.
    data_tests:
    - unique
    - not_null
  - name: iata_code
    data_tests:
    - unique
    - not_null
  - name: airport_name
    data_tests:
    - not_null
- name: dim_airline
  description: One row per airline operating flights at the monitored airports.
  columns:
  - name: airline_key
    description: Surrogate key generated from the airline ICAO code.
    data_tests:
    - unique
    - not_null
  - name: icao_code
    data_tests:
    - unique
    - not_null
  - name: airline_name
    data_tests:
    - not_null
- name: dim_date
  description: One row per calendar day from 2026 through 2027.
  columns:
  - name: date_key
    description: Date as an integer in YYYYMMDD format.
    data_tests:
    - unique
    - not_null
  - name: full_date
    data_tests:
    - unique
    - not_null
- name: fct_arrivals
  description: One row per arrival flight leg at a monitored Swedish airport.
  columns:
  - name: arrival_key
    data_tests:
    - unique
    - not_null
  - name: airport_key
    data_tests:
    - not_null
  - name: airline_key
    data_tests:
    - not_null
  - name: date_key
    data_tests:
    - not_null
  - name: delay_minutes
    description: Minutes between scheduled and actual time; negative means early.
  - name: is_delayed
    description: True when more than 15 minutes late; null when no actual time.
- name: fct_departures
  description: One row per departure flight leg from a monitored Swedish airport.
  columns:
  - name: departure_key
    data_tests:
    - unique
    - not_null
  - name: airport_key
    data_tests:
    - not_null
  - name: airline_key
    data_tests:
    - not_null
  - name: date_key
    data_tests:
    - not_null
  - name: delay_minutes
    description: Minutes between scheduled and actual time; negative means early.
  - name: is_delayed
    description: True when more than 15 minutes late; null when no actual time.
  
  - name: mart_flight_punctuality
    description: One row per non-deleted flight leg with readable airport, airline and date attributes, for the dashboard.
    columns:
  - name: flight_key
    data_tests:
    - unique
    - not_null
  - name: direction
    data_tests:
    - accepted_values:
        arguments:
          values: ['Arrival', 'Departure']
  - name: airport_name
    data_tests:
    - not_null
  - name: airline_name
    data_tests:
    - not_null
  - name: flight_date
    data_tests:
    - not_null