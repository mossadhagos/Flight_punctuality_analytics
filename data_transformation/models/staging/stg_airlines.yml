version: 2

models:
  - name: stg_airlines
    description: >
      Standardized Wikipedia airline reference records.
      Includes historical operators and reused airline codes.
      Missing reference attributes remain null.
    columns:
      - name: reference_id
        description: "Identifier generated from the original reference row."
        data_tests:
          - unique
          - not_null

      - name: iata_code
        description: "Airline IATA code; may be missing or reused."

      - name: icao_code
        description: "Airline ICAO code; may be missing or reused."

      - name: airline_name
        description: "Airline name; missing values remain null."